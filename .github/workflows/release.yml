name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app
        uses: actions/checkout@v4

      - name: Checkout omashare
        uses: actions/checkout@v4
        with:
          repository: aerorohit/omashare
          path: omashare
          ref: main

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default list still includes the removed "tools" package.
          packages: platform-tools

      - name: SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"

      - name: cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" ]]; then
            echo "Add the ANDROID_KEYSTORE_* repository secrets before tagging a release." >&2
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build signed APK and AAB
        env:
          OMASHARE_ROOT: ${{ github.workspace }}/omashare
          OMASHARE_KEYSTORE: ${{ runner.temp }}/release.keystore
          OMASHARE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          OMASHARE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          OMASHARE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/27.2.12479018"
          ./scripts/release.sh

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/out/*.apk
            dist/out/*.aab
