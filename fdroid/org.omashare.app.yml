License: MIT
AuthorName: aerorohit
SourceCode: https://github.com/aerorohit/omashare-android
IssueTracker: https://github.com/aerorohit/omashare-android/issues
Changelog: https://github.com/aerorohit/omashare-android/releases

Name: Omashare
AutoName: Omashare
Summary: Start a transfer nearby. It keeps going over mobile data.
Description: |-
    Start a transfer with someone nearby, then walk away. The file keeps
    moving in the background, over mobile data if you leave Wi-Fi. You do
    not have to stay next to each other until it finishes.

    The transfer is peer to peer and encrypted. The file goes from one
    device to the other. No server keeps a copy. On the same Wi-Fi that
    path is the local network, so large files are fast. If you leave
    Wi-Fi, the transfer continues over mobile data. A relay is used only
    to connect the two devices when they cannot reach each other
    directly. It cannot read the file.

    Two phones can do this with each other, and a phone can do it with a
    Linux computer running Omashare. The other person accepts before
    anything is saved. Send from Omashare, or from the share menu in
    another app. Accepted files are saved in Downloads/Omashare.

RepoType: git
Repo: https://github.com/aerorohit/omashare-android.git

Builds:
  - versionName: 0.1.1
    versionCode: 2
    commit: v0.1.1
    subdir: app
    sudo:
      - apt-get update
      - apt-get install -y --no-install-recommends curl build-essential pkg-config
    gradle:
      - yes
    srclibs:
      - Omashare::https://github.com/aerorohit/omashare.git::main
    prebuild:
      - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
      - bash -lc 'source "$$HOME/.cargo/env" && cargo install cargo-ndk --locked && NDK=$$(echo "$$ANDROID_HOME"/ndk/*) && ANDROID_NDK_HOME="$$NDK" OMASHARE_ROOT="$$Omashare$$" ./build-native.sh'
    ndk: r27c
    scanignore:
      - app/src/main/jniLibs

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: 0.1.1
CurrentVersionCode: 2
